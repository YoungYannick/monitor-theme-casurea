name: Build and Release Assets

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 校验 tag 与版本号
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag 必须是 x.x.x 形式：$TAG" >&2
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const tag = process.env.TAG;
            for (const file of ["theme.json", "package.json"]) {
              const version = JSON.parse(fs.readFileSync(file, "utf8")).version;
              if (version !== tag) throw new Error(`${file} 的版本 ${version} 与 tag ${tag} 不一致`);
            }
          '

      - run: npm install
      - run: npm run lint
      - run: npm run check
      - name: 构建并打包
        run: npm run package

      - name: 更新变更日志
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CURRENT_COMMIT=$(git rev-parse "${TAG}^{commit}")
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${CURRENT_COMMIT}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Previous tag: $PREVIOUS_TAG"
            CHANGELOG=$(git log --no-merges --pretty=format:'* %s (%h)' "${PREVIOUS_TAG}..${TAG}")
          else
            echo "No previous tag found; using full history"
            CHANGELOG=$(git log --no-merges --pretty=format:'* %s (%h)' "$TAG")
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="* No new commits since ${PREVIOUS_TAG:-repository start}"
          fi
          {
            echo 'CHANGELOG<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.tar.gz release/*.sha256 --verify-tag --title "$TAG" --notes "$CHANGELOG"
