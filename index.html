<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Monitor</title>
    <script>
      ;(function () {
        var name = null
        try {
          name = localStorage.getItem("casurea:site_name")
        } catch (e) {}
        if (name) {
          document.title = name
          window.__titleProbeSource = "inline"
        }
      })()
    </script>
    <script>
      ;(function () {
        var preference = null, mode = "system"
        try { preference = localStorage.getItem("theme"); mode = localStorage.getItem("casurea:site_mode") || "system" } catch (e) {}
        var hour = new Date(Date.now() + 8 * 3600000).getUTCHours()
        var dark = preference === "dark" || preference !== "light" && (mode === "dark" || mode === "auto" && (hour >= 19 || hour < 7) || mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      })()
    </script>
    <script src="/title-probe.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
