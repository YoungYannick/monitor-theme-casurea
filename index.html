<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Monitor</title>
    <script>
      ;(function () {
        var name = null
        try {
          name = localStorage.getItem("casurea:site_name")
        } catch (e) {}
        if (name) {
          document.title = name
          window.__titleProbeSource = "inline"
        }
      })()
    </script>
    <script>
      ;(function () {
        var mode = "system", pureBlack = true
        try {
          var preference = localStorage.getItem("casurea:theme")
          mode = preference === "light" || preference === "dark" || preference === "system"
            ? preference : localStorage.getItem("casurea:site_mode")
          pureBlack = localStorage.getItem("casurea:pure_black_dark") !== "false"
        } catch (e) {}
        var dark = mode === "dark" || mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.classList.toggle("dark-neutral", dark && !pureBlack)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
        document.querySelector('meta[name="theme-color"]').content = dark ? (pureBlack ? "#000000" : "#181818") : "#fafafa"
      })()
    </script>
    <script src="/title-probe.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
